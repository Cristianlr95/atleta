services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - atleta_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:?DB_USERNAME is required} -d ${DB_NAME:?DB_NAME is required}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./atleta-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-atleta-dev}
      DEV_SEED_ENABLED: ${DEV_SEED_ENABLED:-true}
      DEV_SEED_PASSWORD: ${DEV_SEED_PASSWORD:-AtletaDev!2026}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:4201}
      ATLETA_AI_ENABLED: ${ATLETA_AI_ENABLED:-false}
      ATLETA_AI_PROVIDER: ${ATLETA_AI_PROVIDER:-disabled}
      ATLETA_AI_TIMEOUT: ${ATLETA_AI_TIMEOUT:-PT8S}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./atleta-app
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      ATLETA_ENV_NAME: ${ATLETA_ENV_NAME:-development}
      ATLETA_API_BASE_URL: ${ATLETA_API_BASE_URL:-http://localhost:8080/api/v1}
      ATLETA_STORAGE_PREFIX: ${ATLETA_STORAGE_PREFIX:-atleta.dev}
    ports:
      - "4201:80"

volumes:
  atleta_postgres_data:
